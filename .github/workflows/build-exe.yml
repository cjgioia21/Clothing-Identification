name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "pokedeck/**"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: pokedeck-windows
            binary: dist/pokedeck.exe
          - os: ubuntu-latest
            artifact: pokedeck-linux
            binary: dist/pokedeck
          - os: macos-latest
            artifact: pokedeck-macos
            binary: dist/pokedeck
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest
          python -m pip install -e .

      - name: Run the test suite
        run: python -m pytest -q

      - name: Build the executable
        run: pyinstaller --clean packaging/pokedeck.spec

      - name: Smoke-test the executable (Windows)
        if: runner.os == 'Windows'
        run: |
          dist\pokedeck.exe check examples\dragapult.txt
          dist\pokedeck.exe gauntlet examples\dragapult.txt -n 2 --decks 6 --policy greedy

      - name: Smoke-test the executable (Unix)
        if: runner.os != 'Windows'
        run: |
          ./dist/pokedeck check examples/dragapult.txt
          ./dist/pokedeck gauntlet examples/dragapult.txt -n 2 --decks 6 --policy greedy

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach the executables to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
