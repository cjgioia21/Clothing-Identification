[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokedeck"
version = "0.1.0"
description = "Playtest Pokemon TCG decks: legality checks, exact draw odds, and Monte Carlo consistency simulation."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pokedeck = "pokedeck.cli:main"

[tool.setuptools.packages.find]
include = ["pokedeck*"]

[tool.setuptools.package-data]
pokedeck = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
