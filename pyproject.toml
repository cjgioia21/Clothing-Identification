[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokedeck"
version = "0.1.0"
description = "Playtest Pokemon TCG decks: legality checks, draw odds, consistency simulation, and 1000 real games against a 100-deck gauntlet."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pokedeck = "pokedeck.cli:main"

[tool.setuptools.packages.find]
include = ["pokedeck*"]

[tool.setuptools.package-data]
pokedeck = ["data/*.json", "data/*.json.gz", "data/gauntlet/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
